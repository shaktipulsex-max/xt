import time

print("24/7 Loop Code Started...")

while True:
    try:
        # Yahan aapka main code / task aayega
        print("Loop chal raha hai, kaam ho raha hai...")
        
        # Jitni der ka gap rakhna ho (jaise 10 seconds)
        time.sleep(10)
        
    except Exception as e:
        # Agar beech mein koi error aayi toh code crash nahi hoga, loop chalta rahega
        print(f"Error aayi thi: {e}")
        time.sleep(5)
        continue
